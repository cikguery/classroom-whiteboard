<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Whiteboard</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#18212f;background:#eef1f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
header{background:#18212f;color:#fff;padding:12px 16px;font-size:18px;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #d6dce5}
button,select,input{font:inherit}
button{border:1px solid #c8d0dc;background:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}
button.active{background:#dceafe;border-color:#3975d7;color:#174b9c}
button:hover{background:#edf3fc}
label{display:flex;align-items:center;gap:6px;font-size:13px}
input[type=color]{width:35px;height:32px;padding:2px;border:1px solid #c8d0dc;border-radius:6px}
input[type=range]{width:95px}
.workspace{padding:14px;flex:1;display:flex;min-height:0}
.board-wrap{position:relative;flex:1;min-height:65vh;background:white;border:1px solid #cbd3df;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #15223812}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#draw{z-index:1;touch-action:none}
#preview{z-index:2;pointer-events:none}
.footer{padding:8px 14px;color:#5b6574;font-size:12px}
@media(max-width:600px){.workspace{padding:7px}.board-wrap{min-height:68vh}.toolbar{gap:5px}button{padding:7px 9px}}
</style>
</head>
<body>
<header>Classroom Whiteboard</header>
<div class="toolbar" id="toolbar">
<button data-tool="pen" class="active">Pen</button>
<button data-tool="highlighter">Highlighter</button>
<button data-tool="eraser">Eraser</button>
<button data-tool="line">Line</button>
<button data-tool="rect">Rectangle</button>
<button data-tool="ellipse">Oval</button>
<button data-tool="text">Text</button>
<label>Colour <input id="colour" type="color" value="#172033"></label>
<label>Size <input id="size" type="range" min="1" max="30" value="4"><span id="sizeVal">4</span></label>
<button id="undo">Undo</button><button id="redo">Redo</button><button id="clear">Clear</button>
<button id="prev">◀ Page</button><span id="pageLabel">1 / 1</span><button id="next">Page ▶</button>
<button id="save">Save PNG</button>
</div>
<div class="workspace"><div class="board-wrap" id="board">
<canvas id="draw"></canvas><canvas id="preview"></canvas>
</div></div>
<div class="footer">Select a tool, then draw on the whiteboard. Shapes are previewed on a separate layer and committed when you release the pointer.</div>
<script>
(() => {
const base=document.getElementById('draw'), overlay=document.getElementById('preview');
const ctx=base.getContext('2d'), pctx=overlay.getContext('2d');
const board=document.getElementById('board');
let tool='pen', color='#172033', width=4, drawing=false, start=null, last=null;
let pages=[null], pageIndex=0, history=[], future=[];
const shapeTools=new Set(['line','rect','ellipse']);
function dimensions(){const r=board.getBoundingClientRect();return {w:r.width,h:r.height,dpr:Math.max(1,window.devicePixelRatio||1)}}
function setupCanvas(c,context,preserve=true){
  const old=preserve?c.toDataURL():null, {w,h,dpr}=dimensions();
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  context.setTransform(dpr,0,0,dpr,0,0);
  context.lineCap='round';context.lineJoin='round';
  if(old){const im=new Image();im.onload=()=>{context.clearRect(0,0,w,h);context.drawImage(im,0,0,w,h)};im.src=old}
}
function clearPreview(){const {w,h}=dimensions();pctx.clearRect(0,0,w,h)}
function snapshot(){history.push(base.toDataURL());if(history.length>60)history.shift();future=[]}
function restore(data){
  const {w,h}=dimensions();ctx.clearRect(0,0,w,h);
  if(!data)return;
  const im=new Image();im.onload=()=>{ctx.clearRect(0,0,w,h);ctx.drawImage(im,0,0,w,h)};im.src=data;
}
function savePage(){pages[pageIndex]=base.toDataURL()}
function loadPage(i){savePage();pageIndex=i;restore(pages[i]);history=[];future=[];updatePage()}
function updatePage(){document.getElementById('pageLabel').textContent=(pageIndex+1)+' / '+pages.length}
function point(e){const r=base.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function style(context,preview=false){
  context.lineWidth=width;context.strokeStyle=color;context.fillStyle=color;
  context.globalAlpha=tool==='highlighter'?.28:1;
  context.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
}
function drawShape(context,a,b){
  context.beginPath();
  if(tool==='line'){context.moveTo(a.x,a.y);context.lineTo(b.x,b.y);context.stroke()}
  else if(tool==='rect'){context.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}
  else if(tool==='ellipse'){const rx=Math.abs(b.x-a.x)/2,ry=Math.abs(b.y-a.y)/2;context.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(rx,.5),Math.max(ry,.5),0,0,Math.PI*2);context.stroke()}
}
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t))}
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.getElementById('colour').addEventListener('input',e=>color=e.target.value);
document.getElementById('size').addEventListener('input',e=>{width=+e.target.value;document.getElementById('sizeVal').textContent=width});
base.addEventListener('pointerdown',e=>{
  if(tool==='text'){const p=point(e),value=prompt('Enter text:');if(value){snapshot();ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=color;ctx.font=`${Math.max(14,width*5)}px Arial`;ctx.fillText(value,p.x,p.y);ctx.restore()}return}
  snapshot();drawing=true;start=point(e);last=start;base.setPointerCapture(e.pointerId);
  if(shapeTools.has(tool)){clearPreview();pctx.save();pctx.globalCompositeOperation='source-over';pctx.globalAlpha=1;pctx.strokeStyle=color;pctx.lineWidth=width;pctx.lineCap='round';pctx.lineJoin='round';pctx.restore()}
  else {ctx.save();style(ctx);ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(start.x+.01,start.y+.01);ctx.stroke();ctx.restore()}
});
base.addEventListener('pointermove',e=>{
  if(!drawing)return;const p=point(e);
  if(shapeTools.has(tool)){
    clearPreview();pctx.save();pctx.globalCompositeOperation='source-over';pctx.globalAlpha=1;pctx.strokeStyle=color;pctx.lineWidth=width;pctx.lineCap='round';pctx.lineJoin='round';drawShape(pctx,start,p);pctx.restore();
  }else{
    ctx.save();style(ctx);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();last=p;
  }
});
function finish(e){
  if(!drawing)return;const p=point(e);
  if(shapeTools.has(tool)){
    ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';drawShape(ctx,start,p);ctx.restore();clearPreview();
  }
  drawing=false;start=null;last=null;savePage();
}
base.addEventListener('pointerup',finish);base.addEventListener('pointercancel',finish);
document.getElementById('undo').onclick=()=>{if(!history.length)return;future.push(base.toDataURL());restore(history.pop());savePage()};
document.getElementById('redo').onclick=()=>{if(!future.length)return;history.push(base.toDataURL());restore(future.pop());savePage()};
document.getElementById('clear').onclick=()=>{snapshot();const {w,h}=dimensions();ctx.clearRect(0,0,w,h);clearPreview();savePage()};
document.getElementById('prev').onclick=()=>{if(pageIndex>0)loadPage(pageIndex-1)};
document.getElementById('next').onclick=()=>{savePage();if(pageIndex===pages.length-1)pages.push(null);pageIndex++;restore(pages[pageIndex]);history=[];future=[];updatePage()};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download=`whiteboard-page-${pageIndex+1}.png`;a.href=base.toDataURL('image/png');a.click()};
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{savePage();setupCanvas(base,ctx,false);setupCanvas(overlay,pctx,false);restore(pages[pageIndex])},120)});
setupCanvas(base,ctx,false);setupCanvas(overlay,pctx,false);updatePage();
})();
</script>
</body>
</html>
